<body theme="custom-base" lang="zh-cn" class="center-mode app-background">
	<div id="root" class="app-background"></div>
	<script>
		(function () {
			let amis = amisRequire('amis/embed');
			const match = amisRequire('path-to-regexp').match;
			const history = History.createHashHistory();
			const app = {
				type: 'app',
				brandName: '',
				logo: '/public/logo.png',
				header: {
					type: 'tpl',
					inline: false,
					className: 'w-full',
					tpl: '<div class="flex justify-between"><div>鑫众品物流管理系统</div><div><a href="logout">退出登录</a></div></div>'
				},
				//asideAfter: '<div class="p-2 text-center">菜单后面区域</div>',
				api: '/pages/site.json'
			};

			function normalizeLink(to, location = history.location) {
				to = to || '';
				if (to && to[0] === '#') {
					to = location.pathname + location.search + to;
				} else if (to && to[0] === '?') {
					to = location.pathname + to;
				}
				const idx = to.indexOf('?');
				const idx2 = to.indexOf('#');
				let pathname = ~idx ? to.substring(0, idx) : ~idx2 ? to.substring(0, idx2) : to;
				let search = ~idx ? to.substring(idx, ~idx2 ? idx2 : undefined) : '';
				let hash = ~idx2 ? to.substring(idx2) : location.hash;
				if (!pathname) {
					pathname = location.pathname;
				} else if (pathname[0] != '/' && !/^https?\:\/\//.test(pathname)) {
					let relativeBase = location.pathname;
					const paths = relativeBase.split('/');
					paths.pop();
					let m;
					while ((m = /^\.\.?\//.exec(pathname))) {
						if (m[0] === '../') {
							paths.pop();
						}
						pathname = pathname.substring(m[0].length);
					}
					pathname = paths.concat(pathname).join('/');
				}
				return pathname + search + hash;
			}

			function isCurrentUrl(to, ctx) {
				if (!to) {
					return false;
				}
				const pathname = history.location.pathname;
				const link = normalizeLink(to, {
					...location,
					pathname,
					hash: ''
				});
				if (!~link.indexOf('http') && ~link.indexOf(':')) {
					let strict = ctx && ctx.strict;
					return match(link, {
						decode: decodeURIComponent,
						strict: typeof strict !== 'undefined' ? strict : true
					})(pathname);
				}
				return decodeURI(pathname) === link;
			}
			let amisInstance = amis.embed('#root', app, {
				location: history.location,
				data: {},
				context: {}
			}, {
				//全局请求拦截器
				requestAdaptor(api) {
					const baseURL = "http://localhost:5010";
					const excludePrefixes = ["/pages/", "/sdk/", "/public/", ".css", ".js", ".html", ".json", ".png", ".jpg", ".gif"];

					// 检查是否是本地文件，如果是，不转发
					let isLocalFile = false;
					for (let prefix of excludePrefixes) {
						if (api.url && api.url.startsWith(prefix)) {
							isLocalFile = true;
							break;
						}
					}

					// 只有非本地文件，才转发到后端
					if (!isLocalFile && api.url && !api.url.startsWith("http")) {
						api.url = baseURL + api.url;
					}
					api.headers["Authorization"] = 123;
					return api;
				},
				//antd-AsideNav-list
				responseAdaptor(api, response, query, request) {
					if (response.status == -99) {
						localStorage.clear();
						location.href = "/login.html";
					};
					return response;
				},
				updateLocation: (location, replace) => {
					location = normalizeLink(location);
					if (location === 'goBack') {
						return history.goBack();
					} else if ((!/^https?\:\/\//.test(location) && location === history.location.pathname +
						history.location.search) || location === history.location.href) {
						return;
					} else if (/^https?\:\/\//.test(location) || !history) {
						return (window.location.href = location);
					}
					history[replace ? 'replace' : 'push'](location);
				},
				jumpTo: (to, action) => {
					document.querySelector('div.antd-Layout-offScreenBtn').click();
					if (to === 'goBack') {
						return history.goBack();
					}
					to = normalizeLink(to);
					if (isCurrentUrl(to)) {
						return;
					}
					if (action && action.actionType === 'url') {
						action.blank === false ? (window.location.href = to) : window.open(to, '_blank');
						return;
					} else if (action && action.blank) {
						window.open(to, '_blank');
						return;
					}
					if (/^https?:\/\//.test(to)) {
						window.location.href = to;
					} else if ((!/^https?\:\/\//.test(to) && to === history.pathname + history.location
						.search) || to === history.location.href) { } else {
						history.push(to);
					}
				},
				isCurrentUrl: isCurrentUrl,
				theme: 'antd'
			});
			history.listen(state => {
				amisInstance.updateProps({
					location: state.location || state
				});
				try {
					let url = encodeURIComponent(location.href);
					let title = encodeURIComponent(document.title);
					let img = new Image();
					img.src = "https://collect-v6.51.la/v6/collect?dt=4&url=" + url + "&title=" + title + "&rnd=" + Math.random();
				} catch (e) { }
			});
		})();
	</script>
</body>
